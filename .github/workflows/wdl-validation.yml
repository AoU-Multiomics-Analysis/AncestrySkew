name: WDL validation

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - "workflows/**/*.wdl"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - "workflows/**/*.wdl"

jobs:
  miniwdl-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install miniwdl
        run: pipx install miniwdl

      - name: Check WDLs
        run: miniwdl check workflows/ComputeAncestrySkew.wdl
